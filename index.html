<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMP Pádel · Resultados y clasificaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800;1,900&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-css">:root{--bg:#03050a;--panel:#0a0f1c;--panel2:#0d1426;--line:rgba(0,114,250,.22);--blue:#0072fa;--blue2:#3d9bff;--cyan:#6fd0ff;--text:#eaf2ff;--muted:#8a9bb8;--win:#22e3a0;--loss:#ff4d6d;--draw:#ffc857;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:15px;line-height:1.45;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 500px at 15% -10%,rgba(0,114,250,.35),transparent 60%),radial-gradient(700px 500px at 110% 20%,rgba(61,155,255,.18),transparent 60%),repeating-linear-gradient(-18deg,transparent 0 46px,rgba(0,114,250,.035) 46px 48px),var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.h,h1,h2,h3{font-family:"Barlow Condensed",sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.4px;line-height:1}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(3,5,10,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:40px;filter:drop-shadow(0 0 10px rgba(0,114,250,.6))}
.brand b{display:block;font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:22px;letter-spacing:.5px;text-transform:uppercase}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:.2s}
.nav a.on{color:#fff;background:linear-gradient(120deg,var(--blue),var(--blue2));border-color:transparent;box-shadow:0 4px 18px rgba(0,114,250,.45)}
@media(min-width:760px){.top-in{flex-direction:row;align-items:center;justify-content:space-between;padding:10px 16px}.nav{padding-bottom:0}}

/* hero */
.hero{position:relative;text-align:center;padding:34px 0 18px}
.logo-wrap{position:relative;width:210px;height:210px;margin:0 auto 14px;display:grid;place-items:center}
.logo-wrap:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(0,114,250,.0),rgba(61,155,255,.75),transparent 40%);animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%,#000 66%,transparent 67%);mask:radial-gradient(circle,transparent 62%,#000 63%,#000 66%,transparent 67%)}
.logo-wrap:after{content:"";position:absolute;inset:20px;border-radius:50%;background:radial-gradient(circle,rgba(0,114,250,.35),transparent 70%);filter:blur(10px);animation:pulse 3s ease-in-out infinite}
.logo-wrap img{position:relative;z-index:1;width:190px;filter:drop-shadow(0 0 22px rgba(0,114,250,.7));animation:float 4s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.5;transform:scale(.92)}}
@keyframes float{50%{transform:translateY(-6px)}}
.hero h1{font-size:clamp(40px,11vw,72px);background:linear-gradient(100deg,#fff 20%,var(--cyan) 50%,var(--blue2) 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin-top:8px;font-weight:500}
.stats{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.stat{padding:10px 16px;border-radius:14px;background:rgba(0,114,250,.1);border:1px solid var(--line);min-width:96px}
.stat b{display:block;font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:28px;color:#fff}
.stat small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}

.demo{margin:14px 0 4px;padding:10px 14px;border-radius:12px;background:rgba(255,200,87,.08);border:1px dashed rgba(255,200,87,.45);color:#ffe2a3;font-size:13.5px}

.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h2{font-size:26px;position:relative;padding-left:14px}
.sec-h h2:before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:5px;border-radius:3px;background:linear-gradient(var(--cyan),var(--blue));transform:skewX(-14deg)}
.sec-h a{color:var(--blue2);font-weight:600;font-size:14px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:linear-gradient(160deg,rgba(0,114,250,.13),rgba(255,255,255,.02) 55%);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative;overflow:hidden}

/* team card */
.tcard{display:block;transition:transform .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 12px 34px rgba(0,114,250,.25)}
.tcard:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;background:repeating-linear-gradient(-30deg,rgba(0,114,250,.18) 0 6px,transparent 6px 16px);border-radius:50%;opacity:.6}
.tc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.tc-liga{color:var(--muted);font-size:13px}
.tcard h3{font-size:30px;margin:10px 0 8px}
.tc-main{display:flex;align-items:flex-end;gap:18px}
.pos b{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:64px;line-height:.9;background:linear-gradient(180deg,#fff,var(--blue2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pos small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase}
.tc-kpis{display:flex;gap:16px;padding-bottom:6px}
.tc-kpis b{display:block;font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-size:26px}
.tc-kpis small{color:var(--muted);font-size:12px;text-transform:uppercase}
.forma{display:flex;gap:6px;margin:12px 0 10px;align-items:center}
.forma .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;margin-right:4px}
.dot{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#03050a;transform:skewX(-8deg)}
.dot.V{background:var(--win);box-shadow:0 0 10px rgba(34,227,160,.45)}
.dot.D{background:var(--loss)}
.dot.E{background:var(--draw)}
.dot.n{background:rgba(255,255,255,.07)}
.tc-next{font-size:13.5px;color:var(--muted);border-top:1px solid rgba(255,255,255,.07);padding-top:10px}
.tc-next b{color:#fff}

/* matches */
.list{display:flex;flex-direction:column;gap:10px}
.match{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-left:4px solid rgba(255,255,255,.15);border-radius:14px;padding:12px 14px}
.match.m-V{border-left-color:var(--win)}
.match.m-D{border-left-color:var(--loss)}
.match.m-E{border-left-color:var(--draw)}
.m-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.m-meta .j{font-family:"Barlow Condensed";font-style:italic;font-weight:800;color:var(--blue2);font-size:15px}
.tag{padding:1px 8px;border-radius:6px;background:rgba(0,114,250,.18);color:var(--cyan);font-weight:700;font-size:11.5px}
.m-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.m-team{font-weight:600;font-size:15px}
.m-team.us{color:#fff;font-weight:800}
.m-body .m-team:last-child{text-align:right}
.m-score{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:28px;padding:0 6px;color:#fff}
.m-score i{color:var(--muted);padding:0 4px}
.m-score.vs{font-size:18px;color:var(--muted)}
.m-foot{margin-top:8px;display:flex;justify-content:flex-end}
.badge{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 9px;border-radius:999px}
.b-V{background:rgba(34,227,160,.14);color:var(--win)}
.b-D{background:rgba(255,77,109,.14);color:var(--loss)}
.b-E{background:rgba(255,200,87,.14);color:var(--draw)}
.b-P{background:rgba(255,255,255,.06);color:var(--muted)}

/* team page */
.thero{padding:26px 0 6px;position:relative}
.thero h1{font-size:clamp(40px,10vw,64px);margin:10px 0 4px}
.thero p{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:14px;display:flex;align-items:center;gap:12px}
.kpi b{display:block;font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:36px;line-height:1}
.kpi small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--blue2) calc(var(--p)*1%),rgba(255,255,255,.08) 0);position:relative}
.ring:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--panel2)}
.ring span{position:relative;font-family:"Barlow Condensed";font-weight:800;font-size:16px}
.subtabs{display:flex;gap:4px;margin-top:22px;padding:4px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.subtabs button{flex:1;padding:10px 6px;border-radius:10px;font-weight:700;color:var(--muted);font-size:14px}
.subtabs button.on{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 4px 14px rgba(0,114,250,.35)}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;text-align:center;padding:11px 8px;background:rgba(0,114,250,.08);white-space:nowrap}
td{text-align:center;padding:11px 8px;border-top:1px solid rgba(255,255,255,.05);white-space:nowrap}
th.l,td.l{text-align:left}
td.pts{font-family:"Barlow Condensed";font-weight:800;font-size:19px;color:#fff}
tr.us td{background:linear-gradient(90deg,rgba(0,114,250,.32),rgba(0,114,250,.08));font-weight:700}
tr.us td:first-child{box-shadow:inset 4px 0 0 var(--cyan)}
.pn{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.06);font-weight:800;font-size:13px}
.pn.top{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}
.legend{color:var(--muted);font-size:12px;margin-top:8px}

/* players */
.pl{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:14px}
.pl .rk{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:26px;color:var(--blue2);width:30px;text-align:center}
.pl .nm{font-weight:700;font-size:15.5px}
.pl .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--cyan))}
.pl .pc{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:26px}
.pl .pc small{font-size:14px;color:var(--muted)}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin-bottom:18px}
.pod{text-align:center;padding:14px 8px 12px;border-radius:16px 16px 10px 10px;background:linear-gradient(180deg,rgba(0,114,250,.28),rgba(0,114,250,.06));border:1px solid var(--line)}
.pod.p1{padding-top:22px;background:linear-gradient(180deg,rgba(61,155,255,.5),rgba(0,114,250,.1));box-shadow:0 10px 40px rgba(0,114,250,.35)}
.pod .med{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:34px;line-height:1}
.pod .nm{font-weight:700;font-size:14px;margin-top:6px;word-break:break-word}
.pod .pc{font-family:"Barlow Condensed";font-weight:800;font-size:22px;color:var(--cyan)}
.pod small{color:var(--muted);font-size:11.5px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.1);font-weight:700;font-size:13px;color:var(--muted)}
.filters button.on{border-color:var(--blue2);color:#fff;background:rgba(0,114,250,.25)}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed rgba(255,255,255,.12);border-radius:14px}

/* footer */
.foot{max-width:1100px;margin:20px auto 0;padding:20px 16px 110px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.06)}
.btn{padding:9px 16px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.14)}
.btn.pri{background:linear-gradient(120deg,var(--blue),var(--blue2));border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(0,114,250,.4)}
.btn.warn{border-color:rgba(255,77,109,.5);color:#ffb3c1}
.btn:disabled{opacity:.5}

/* edit */
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(6,10,20,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center;justify-content:space-between}
.ebar span{font-weight:700;color:var(--cyan);font-size:13px}
.ebar div{display:flex;gap:8px}
.esec{margin-top:24px}
.esec h2{font-size:22px;margin-bottom:6px}
.hint{color:var(--muted);font-size:13px;margin-bottom:10px}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
input,select{font:inherit;color:#fff;background:#0b1222;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
input:focus,select:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(0,114,250,.25)}
.etbl td{padding:5px 4px}
.etbl input{padding:7px 6px;font-size:14px}
.etbl input.n{width:58px;text-align:center}
.etbl input.t{min-width:140px}
.etbl input.d{min-width:140px}
.del{width:32px;height:32px;border-radius:9px;color:#ffb3c1;background:rgba(255,77,109,.1)}
.add{margin-top:10px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.3s;background:#0d1730;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.kpi .forma{gap:3px}.kpi .dot{width:17px;height:17px;font-size:10px;border-radius:5px}.kpi .ring{width:52px;height:52px}
.news-list{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.news{padding:0}
.news-in{padding:14px 16px 16px}
.news h3{font-size:26px;margin:2px 0 10px}
.ph-strip{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#000}
.ph-strip::-webkit-scrollbar{display:none}
.ph{flex:0 0 82%;scroll-snap-align:start;padding:0;display:block}
.ph-strip.one .ph{flex-basis:100%}
.ph img{display:block;width:100%;height:240px;object-fit:cover}
.score-band{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(0,114,250,.12);border:1px solid var(--line);margin-bottom:10px;position:relative}
.score-band.bV{background:linear-gradient(100deg,rgba(34,227,160,.14),rgba(0,114,250,.12))}
.score-band .m-team:nth-child(3){text-align:right}
.score-band .badge{grid-column:1/-1;justify-self:center}
.news-txt{color:#c9d6ee;font-size:15px}
.more{display:inline-block;margin-top:8px;color:var(--blue2);font-weight:700;font-size:14px}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;place-items:center;padding:16px}
.lb.on{display:grid}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
textarea{font:inherit;color:#fff;background:#0b1222;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 10px;width:100%;resize:vertical;text-transform:none;letter-spacing:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.th{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#0b1222;border:1px solid rgba(255,255,255,.14)}
.th img{width:100%;height:100%;object-fit:cover}
.th .del{position:absolute;top:4px;right:4px;width:26px;height:26px;background:rgba(0,0,0,.7)}
.addph{display:grid;place-items:center;color:var(--blue2);font-weight:700;font-size:13px;cursor:pointer;border-style:dashed}
.addph input{display:none}
.esec.card{padding:14px}
.ph img{height:200px;object-position:center 45%}
.ph,.ph-strip.one .ph{flex:0 0 auto}.ph img{width:auto;max-width:85vw;height:200px;object-fit:cover}.ph-strip{padding:8px;gap:8px;background:rgba(0,0,0,.35)}.ph img{border-radius:10px}
.upd{margin:14px 0 4px;padding:9px 14px;border-radius:12px;background:rgba(0,114,250,.08);border:1px solid var(--line);color:var(--muted);font-size:13px}
.upd a,.src{color:var(--blue2);font-weight:600}
.prs{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.pr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.pr b{display:block;font-weight:600}
.pr small{display:block;color:var(--muted);font-size:12px}
.pr-r{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:12px}
.pr.w .pr-r{background:rgba(34,227,160,.15);color:var(--win)}
.pr.l .pr-r{background:rgba(255,77,109,.15);color:var(--loss)}
.pr-s{font-family:"Barlow Condensed";font-weight:700;font-size:15px;color:#fff;white-space:nowrap}
/* visitas */
.tbar{max-width:1100px;margin:0 auto;padding:6px 16px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.visits{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(0,114,250,.12);border:1px solid var(--line);color:#cfe0ff}
.visits b{font-family:"Barlow Condensed";font-weight:800;font-size:14px;color:#fff;letter-spacing:.3px}
.vdot{width:7px;height:7px;border-radius:50%;background:var(--win);box-shadow:0 0 8px var(--win);animation:pulse 2s infinite}
/* X3 */
.x3{position:fixed;right:16px;bottom:18px;z-index:45;font-size:14.5px}
body:has(.ebar) .x3{bottom:84px}
.x3-fab{position:relative;width:76px;height:92px;display:block;padding:0}
.x3-fab .ball{position:absolute;left:8px;bottom:12px;width:60px;height:60px;animation:bounce 1.6s cubic-bezier(.3,0,.5,1) infinite;filter:drop-shadow(0 6px 14px rgba(212,240,58,.35))}
.x3-tag{position:absolute;left:50%;top:-2px;transform:translateX(-50%);z-index:2;font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:17px;line-height:1;padding:3px 8px 2px;border-radius:8px;color:#fff;background:linear-gradient(120deg,var(--blue),var(--cyan));box-shadow:0 4px 14px rgba(0,114,250,.6);animation:tagb 1.6s cubic-bezier(.3,0,.5,1) infinite;letter-spacing:.5px}
.x3-shadow{position:absolute;left:18px;bottom:4px;width:40px;height:8px;border-radius:50%;background:rgba(0,0,0,.55);animation:shad 1.6s cubic-bezier(.3,0,.5,1) infinite}
.x3-hi{position:absolute;right:82px;bottom:38px;white-space:nowrap;background:#fff;color:#06101f;font-weight:700;font-size:13px;padding:7px 11px;border-radius:12px 12px 2px 12px;opacity:0;transform:translateX(8px);transition:.3s;pointer-events:none}
.x3.hint .x3-hi{opacity:1;transform:none}
.x3.open .x3-hi{display:none}
@keyframes bounce{0%,100%{transform:translateY(-20px) rotate(-8deg)}48%{transform:translateY(0) rotate(4deg) scale(1.06,.92)}55%{transform:translateY(0) scale(.96,1.04)}}
@keyframes tagb{0%,100%{transform:translateX(-50%) translateY(0)}48%,55%{transform:translateX(-50%) translateY(18px)}}
@keyframes shad{0%,100%{transform:scale(.55);opacity:.35}48%,55%{transform:scale(1);opacity:.7}}
.ball .eyes{transform-origin:50px 47px;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.x3.talk .x3-av .ball{animation:wiggle .35s infinite}
@keyframes wiggle{50%{transform:rotate(10deg) translateY(-2px)}}
.x3-panel{position:absolute;right:0;bottom:100px;width:min(360px,calc(100vw - 32px));height:min(520px,calc(100vh - 170px));display:flex;flex-direction:column;background:rgba(8,13,26,.97);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,114,250,.15);overflow:hidden;opacity:0;transform:translateY(16px) scale(.96);transform-origin:bottom right;pointer-events:none;transition:.25s}
.x3.open .x3-panel{opacity:1;transform:none;pointer-events:auto}
.x3-head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(120deg,rgba(0,114,250,.35),rgba(0,114,250,.08));border-bottom:1px solid var(--line)}
.x3-head b{font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:22px;display:block;line-height:1}
.x3-head small{color:var(--muted);font-size:12px}
.x3-av{width:40px;height:40px}
.x3-av .ball{width:40px;height:40px}
.x3-close{margin-left:auto;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.06);color:var(--muted)}
.x3-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.x3-m{max-width:88%;padding:9px 12px;border-radius:14px;line-height:1.45}
.x3-m.bot{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);border-top-left-radius:4px;align-self:flex-start}
.x3-m.me{background:linear-gradient(120deg,var(--blue),var(--blue2));align-self:flex-end;border-top-right-radius:4px}
.x3-m b{color:#fff}
.x3-V{color:var(--win);font-weight:700}.x3-D{color:var(--loss);font-weight:700}.x3-E{color:var(--draw);font-weight:700}
.x3-prs{margin-top:6px;font-size:13px;color:#c9d6ee}
.x3-go{display:inline-block;margin-top:8px;padding:6px 11px;border-radius:10px;background:rgba(0,114,250,.22);border:1px solid var(--line);color:var(--cyan);font-weight:700;font-size:13px}
.x3-chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
.x3-chips::-webkit-scrollbar{display:none}
.x3-chips button{flex:none;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(0,114,250,.1);color:#cfe0ff;font-size:13px;font-weight:600}
.x3-form{display:flex;gap:8px;padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,.06)}
.x3-form input{flex:1}
.x3-form button{width:42px;border-radius:10px;background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;font-size:16px}
.x3-typing{display:inline-flex;gap:4px}
.x3-typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:typ 1s infinite}
.x3-typing i:nth-child(2){animation-delay:.15s}.x3-typing i:nth-child(3){animation-delay:.3s}
@keyframes typ{50%{transform:translateY(-4px);opacity:.4}}
.foot{padding-bottom:130px}
.x3-go{display:table}
/* copa */
.tag.copa{background:rgba(255,200,87,.15);color:#ffd77a}
.tc-copa{margin-top:8px;font-size:13.5px;color:var(--muted)}
.tc-copa b{color:#fff}.tc-copa.out b{color:#ffb3c1}.tc-copa.live b{color:#ffd77a}.tc-copa.win b{color:var(--win)}
.copa-hero{display:flex;align-items:center;gap:14px}
.copa-hero .trophy{font-size:40px;filter:drop-shadow(0 0 12px rgba(255,200,87,.5))}
.copa-hero small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.copa-hero b{display:block;font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:30px;text-transform:uppercase;line-height:1.05;margin:2px 0 4px}
.copa-hero.live b{color:#ffd77a}.copa-hero.out b{color:#ffb3c1}.copa-hero.win b{color:var(--win)}
.copa-hero .src{font-size:13px}
.h-sub{font-size:13px;color:var(--muted);font-style:normal;font-weight:600;text-transform:none;letter-spacing:0;margin-left:6px}
.filters.comp{margin:0 0 12px}
.subtabs button{font-size:13.5px;padding:10px 4px}
/* instagram + plantilla */
.ig{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-weight:700;font-size:13.5px;color:#fff;background:linear-gradient(120deg,#7b3fe4,#e1306c 55%,#f7a046);box-shadow:0 4px 16px rgba(225,48,108,.3)}
.ig.big{padding:10px 18px;font-size:15px}
.hero-ig{margin-top:14px}
.squads{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.squad-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.squad-h h3{font-size:28px;margin-top:8px}
.squad-n{text-align:right}
.squad-n b{display:block;font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:34px;line-height:1;color:var(--cyan)}
.squad-n small{color:var(--muted);font-size:12px;text-transform:uppercase}
.squad-grid{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.sp{display:flex;align-items:center;gap:9px;padding:8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.sp .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--cyan))}
.sp b{display:block;font-size:13.5px;font-weight:700;line-height:1.2}
.sp small{color:var(--muted);font-size:11.5px}
.squad .src{display:inline-block;margin-top:12px;font-size:13.5px}
.ig-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}
.ig-cta b{display:block;font-family:"Barlow Condensed";font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase}
.ig-cta small{color:var(--muted)}
@media(max-width:360px){.squad-grid{grid-template-columns:1fr}}
.x3-hint{color:var(--muted);font-size:12px}
.tbar{min-height:0;justify-content:flex-start}.visits[hidden]{display:none}.tbar:has(.visits[hidden]){padding:0}
</style>
</head>

    pct:jug.length?Math.round(v*100/jug.length):0,forma:jug.slice(-5).map(outcome),prox:pend[0]||null};
}
function formaDots(f){var h='';for(var i=0;i<5;i++){var o=f[i];h+='<span class="dot '+(o||'n')+'">'+(o||'')+'</span>';}return h;}

function getPath(o,path){var ps=path.split('.');for(var i=0;i<ps.length;i++){o=o[ps[i]];}return o;}
function setPath(o,path,v){var ps=path.split('.'),k=ps.pop();getPath(o,ps.join('.'))[k]=v;}
function toast(msg,ms){toastEl.textContent=msg;toastEl.className='on';clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.className='';},ms||3200);}

function views(D){return ['inicio','noticias'].concat(D.equipos.map(function(t){return t.id;}),['plantilla','ranking']);}

/* ---------- render ---------- */
function render(){

  else { var ti=D.equipos.findIndex(function(t){return t.id===v;}); body=edit?editTeam(D.equipos[ti],ti):viewTeam(D.equipos[ti]); }
  root.innerHTML=header(D,v)+'<main class="wrap">'+(D.actualizado&&!edit&&!D.demo?'<div class="upd">Datos de la <a href="https://www.bizkaiapadel.com/Home/Liga" target="_blank" rel="noopener">Federación Bizkaina de Pádel</a> · actualizado '+esc(D.actualizado)+'</div>':'')+(D.demo&&!edit?'<div class="demo">⚠️ Las clasificaciones, partidos y jugadores son <b>datos de ejemplo</b> para ver cómo queda la web. Pulsa <b>Editar</b> (abajo) para poner los resultados reales.</div>':'')+body+'</main>'+footer(D)+(edit?editBar():'');
}

function header(D,v){

    items.map(function(it){return '<a href="#'+it[0]+'" class="'+(v===it[0]?'on':'')+'">'+esc(it[1])+'</a>';}).join('')+'</nav></div></header>';

function igUrl(D){return D.instagram?'https://www.instagram.com/'+String(D.instagram).replace(/^@/,'')+'/':'';}

function footer(D){
  return '<footer class="foot"><span>'+esc(D.club)+' · '+esc(D.sede)+' · Temporada '+esc(D.temporada)+'</span>'+igBtn(D)+(edit||!IN_CLAUDE?'':'<button class="btn" data-act="edit">✎ Editar</button>')+'</footer>';

function secH(title,link){return '<div class="sec-h"><h2>'+title+'</h2>'+(link||'')+'</div>';}

function matchRow(p,t,showTeam,detail){
  var o=outcome(p);
  return '<div class="match '+(o?'m-'+o:'')+'"><div class="m-meta">'+(p.ronda?'<span class="j">'+esc(rondaCorta(p.ronda))+'</span><span class="tag copa">🏆 Copa</span>':'<span class="j">J'+esc(p.j)+'</span>')+'<span>'+fmtDate(p.fecha)+'</span>'+(showTeam?'<span class="tag">'+esc(t.corto||t.nombre)+'</span>':'')+(p.hora?'<span>'+esc(p.hora)+'</span>':'')+'<span>· '+esc(p.lugar)+(p.sede?' · '+esc(p.sede):'')+'</span></div>'+
  '<div class="m-body"><span class="m-team us">'+esc(t.nombre)+'</span>'+(o?'<span class="m-score">'+num(p.dmp)+'<i>–</i>'+num(p.riv)+'</span>':'<span class="m-score vs">VS</span>')+'<span class="m-team">'+esc(p.rival)+'</span></div>'+
  (detail&&p.parejas&&p.parejas.length?'<div class="prs">'+p.parejas.map(function(x){return '<div class="pr '+(x.g?'w':'l')+'"><span class="pr-r">'+(x.g?'✓':'✗')+'</span><div><b>'+esc(x.dmp)+'</b><small>vs '+esc(x.riv)+'</small></div><span class="pr-s">'+esc(x.sets)+'</span></div>';}).join('')+'</div>':'')+

function teamCard(t){
  var s=teamStats(t);
  return '<a class="card tcard" href="#'+esc(t.id)+'"><div class="tc-top"><span class="chip">'+esc(t.categoria)+'</span><span class="tc-liga">'+esc(t.liga)+'</span></div><h3>'+esc(t.nombre)+'</h3>'+
  '<div class="tc-main"><div class="pos"><b>'+(s.pos?s.pos+'º':'–')+'</b><small>'+(s.total?'de '+s.total+' equipos':'Sin clasificación')+'</small></div><div class="tc-kpis"><div><b>'+(s.row?num(s.row.pts):'–')+'</b><small>Puntos</small></div><div><b>'+s.v+'/'+s.jug+'</b><small>Victorias</small></div></div></div>'+
  '<div class="forma"><span class="lbl">Forma</span>'+formaDots(s.forma)+'</div>'+
  '<div class="tc-next">'+(s.prox?'Próximo · J'+esc(s.prox.j)+' vs <b>'+esc(s.prox.rival)+'</b> · '+fmtDate(s.prox.fecha):'Sin partidos pendientes')+'</div>'+(copaEstado(t)?'<div class="tc-copa '+copaEstado(t).cls+'">🏆 Copa · <b>'+esc(copaEstado(t).txt)+'</b></div>':'')+'</a>';

function allPlayers(D,mode){
  var out=[];D.equipos.forEach(function(t){t.jugadores.forEach(function(p){var s=pstat(p,mode);s.team=t;if(s.pj>0||(mode||compFilter)==='total')out.push(s);});});

}

function viewInicio(D){
  var nj=0,np=0,all=[];
  D.equipos.forEach(function(t){nj+=t.jugadores.length;allMatchesOf(t).forEach(function(p){all.push({p:p,t:t});if(played(p))np++;});});
  var rec=all.filter(function(x){return played(x.p);}).sort(byDate).reverse().slice(0,6);
  var up=all.filter(function(x){return !played(x.p);}).sort(byDate).slice(0,6);
  var top=allPlayers(D,'total').filter(function(p){return p.pj>0;}).slice(0,5);

    (igUrl(D)?'<div class="hero-ig">'+igBtn(D,true)+'</div>':'')+'<div class="stats"><div class="stat"><b>'+D.equipos.length+'</b><small>Equipos</small></div><div class="stat"><b>'+nj+'</b><small>Jugadores</small></div><div class="stat"><b>'+np+'</b><small>Partidos</small></div></div></section>'+
    (news(D).length?'<section class="sec">'+secH('Última hora','<a href="#noticias">Todas las noticias →</a>')+'<div class="news-list">'+news(D).slice(0,2).map(function(n){return newsCard(D,n,true);}).join('')+'</div></section>':'')+

    '<section class="sec grid">'+
      '<div>'+secH('Últimos resultados')+(rec.length?'<div class="list">'+rec.map(function(x){return matchRow(x.p,x.t,true);}).join('')+'</div>':'<div class="empty">Aún no hay resultados.</div>')+'</div>'+
      '<div>'+secH('Próximos partidos')+(up.length?'<div class="list">'+up.map(function(x){return matchRow(x.p,x.t,true);}).join('')+'</div>':'<div class="empty">No hay partidos programados.</div>')+'</div>'+
    '</section>'+
    '<section class="sec">'+secH('Top jugadores <small class="h-sub">liga + copa</small>','<a href="#ranking">Ver ranking →</a>')+(top.length?'<div class="list">'+top.map(function(p,i){return playerRow(p,i,true);}).join('')+'</div>':'<div class="empty">Sin estadísticas todavía.</div>')+'</section>';

function playerRow(p,i,showTeam){
  return '<div class="pl"><span class="rk">'+(i+1)+'</span><div><div class="nm">'+esc(p.nombre)+(showTeam?' <span class="tag">'+esc(p.team.corto||p.team.nombre)+'</span>':'')+'</div>'+

      tab.map(function(r,i){var d=num(r.sf)-num(r.sc);return '<tr class="'+(isUs(r,t)?'us':'')+'"><td><span class="pn '+(i<3?'top':'')+'">'+(i+1)+'</span></td><td class="l">'+esc(r.equipo)+'</td><td>'+num(r.pj)+'</td><td>'+num(r.pg)+'</td><td>'+num(r.pp)+'</td><td>'+(d>0?'+':'')+d+'</td><td class="pts">'+num(r.pts)+'</td></tr>';}).join('')+

  }

  return '<section class="thero"><span class="chip">'+esc(t.categoria)+'</span><h1>'+esc(t.nombre)+'</h1><p>'+esc(t.liga)+(t.fuente?' · <a class="src" href="'+esc(t.fuente)+'" target="_blank" rel="noopener">Ver en la Federación ↗</a>':'')+'</p>'+
    '<div class="kpis"><div class="card kpi"><div><b>'+(s.pos?s.pos+'º':'–')+'</b><small>Posición'+(s.total?' / '+s.total:'')+'</small></div></div>'+

function compChips(){return '<div class="filters comp">'+[['total','Liga + Copa'],['liga','Liga'],['copa','Copa']].map(function(x){return '<button data-act="cf" data-v="'+x[0]+'" class="'+(compFilter===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div>';}

function viewPlantilla(D){

function news(D){return (D.noticias||[]).slice().sort(function(a,b){return String(b.fecha+b.hora).localeCompare(String(a.fecha+a.hora));});}
function teamById(D,id){for(var i=0;i<D.equipos.length;i++){if(D.equipos[i].id===id)return D.equipos[i];}return null;}

function newsCard(D,n,short){

function shrink(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var M=1280,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,M/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);var d=c.toDataURL('image/webp',0.75);if(d.indexOf('data:image/webp')!==0)d=c.toDataURL('image/jpeg',0.78);res(d);};
  img.onerror=function(){URL.revokeObjectURL(url);rej();};img.src=url;});}

function editTable(path,sec,cols,rows){
  var h='<div class="tbl-wrap etbl"><table><thead><tr>'+cols.map(function(c){return '<th class="'+(c.t==='text'?'l':'')+'">'+c.l+'</th>';}).join('')+'<th></th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    h+='<tr>'+cols.map(function(c){var p=path+'.'+i+'.'+c.k,v=r[c.k];
      if(c.t==='sel')return '<td><select data-path="'+p+'">'+c.o.map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>';}).join('')+'</select></td>';
      if(c.t==='num')return '<td><input class="n" type="number" inputmode="numeric" data-num data-path="'+p+'" value="'+esc(v)+'"></td>';
      if(c.t==='date')return '<td><input class="d" type="date" data-path="'+p+'" value="'+esc(v)+'"></td>';
      return '<td class="l"><input class="t" type="text" data-path="'+p+'" value="'+esc(v)+'"'+(c.ph?' placeholder="'+c.ph+'"':'')+'></td>';
    }).join('')+'<td><button class="del" title="Borrar fila" data-act="del" data-path="'+path+'.'+i+'">✕</button></td></tr>';
  });
  return h+'</tbody></table></div><button class="btn add" data-act="add" data-path="'+path+'" data-sec="'+sec+'">+ Añadir fila</button>';
}

function clean(D){
  var d=JSON.parse(JSON.stringify(D));
  d.equipos.forEach(function(t){
    t.clasificacion=t.clasificacion.filter(function(r){return String(r.equipo).trim();});
    t.partidos=t.partidos.filter(function(p){return String(p.rival).trim();});
    t.jugadores=t.jugadores.filter(function(p){return String(p.nombre).trim();});
  });
  d.noticias=(d.noticias||[]).filter(function(n){return String(n.titulo||'').trim()||String(n.texto||'').trim()||(n.fotos||[]).length;});
  return d;
}
function buildDoc(D){
  var css=document.getElementById('app-css').textContent, js=document.getElementById('app-js').textContent, logo=document.getElementById('logo-data').textContent.trim();
  var json=JSON.stringify(D,null,1).replace(/</g,'\\u003c');

  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n'+HEAD+'<style id="app-css">'+css+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script id="logo-data" type="text/plain">'+logo+E+'\n<script id="data" type="application/json">'+json+E+'\n<script id="app-js">'+js+E+'\n</body>\n</html>\n';
}
function save(btn){
  if(!artifactNS){toast('Para publicar, abre la web publicada en claude.ai con tu cuenta de propietario.',4500);return;}
  btn.disabled=true;btn.textContent='Publicando…';
  artifactNS.publish(buildDoc(clean(edit))).then(function(){toast('¡Publicado! Recargando…');}).catch(function(e){
    btn.disabled=false;btn.textContent='Guardar y publicar';
    var c=String((e&&(e.code||e.message))||e||'');
    if(/not_granted|not_writer/.test(c))toast('Solo el propietario o los editores pueden publicar cambios.',4500);
    else if(/conflict/.test(c))toast('Alguien publicó a la vez; la página se recargará.',4500);
    else toast('No se pudo publicar: '+c,5000);
  });
}

  var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;

  if(a==='sub'){sub=b.dataset.v;render();}
  else if(a==='photo'){lb.querySelector('img').src=b.dataset.src;lb.classList.add('on');}
  else if(a==='addnews'){if(!edit.noticias)edit.noticias=[];var dt=new Date(),p=function(x){return (x<10?'0':'')+x;};edit.noticias.unshift({titulo:'',fecha:dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate()),hora:'',equipo:'',rival:'',dmp:'',riv:'',texto:'',fotos:[]});render();}
  else if(a==='delphoto'){var pp=b.dataset.path.split('.'),k=+pp.pop();getPath(edit,pp.join('.')).splice(k,1);render();}
  else if(a==='rf'){rankFilter=b.dataset.v;render();}
  else if(a==='cf'){compFilter=b.dataset.v;render();}
  else if(a==='edit'){edit=JSON.parse(JSON.stringify(DATA));render();window.scrollTo(0,0);}
  else if(a==='cancel'){edit=null;render();}
  else if(a==='save'){save(b);}
  else if(a==='add'){getPath(edit,b.dataset.path).push(JSON.parse(JSON.stringify(TPL[b.dataset.sec])));render();}
  else if(a==='del'){var ps=b.dataset.path.split('.'),i=+ps.pop();getPath(edit,ps.join('.')).splice(i,1);render();}
  else if(a==='clear'){
    if(!clearArmed){clearArmed=true;render();return;}
    clearArmed=false;edit.demo=false;
    edit.equipos.forEach(function(t){t.clasificacion=[{equipo:t.nombre,pj:0,pg:0,pp:0,sf:0,sc:0,pts:0}];t.partidos=[];t.jugadores=[];});

  }

function findTeam(q){
  if(/chica|femen|mujer|valky|neska|ellas/.test(q))return teamById(DATA,'femenino');
  if(/quinta|\b5\b|5a|5ª/.test(q))return teamById(DATA,'quinta');
  if(/sexta|\b6\b|6a|academy/.test(q))return teamById(DATA,'sexta');
  return null;
}
function findPlayer(q){
  var best=null;
  DATA.equipos.forEach(function(t){t.jugadores.forEach(function(p){
    var parts=norm(p.nombre).split(/\s+/).filter(function(w){return w.length>3;});
    var hits=parts.filter(function(w){return new RegExp('\\b'+w+'\\b').test(q);}).length;
    if(hits&&(!best||hits>best.h))best={p:p,t:t,h:hits};
  });});
  return best;
}
function byF(a,b){return String(a.fecha).localeCompare(String(b.fecha));}
function nextOf(t,list){return (list||allMatchesOf(t)).filter(function(p){return !played(p);}).sort(byF)[0]||null;}
function lastOf(t,list){var j=(list||allMatchesOf(t)).filter(played).sort(byF);return j[j.length-1]||null;}
function mLine(t,p){var o=outcome(p);return '<b>'+esc(t.nombre)+'</b> '+(o?num(p.dmp)+'–'+num(p.riv):'vs')+' '+esc(p.rival)+' · '+(p.ronda?'Copa, '+esc(rondaCorta(p.ronda)).toLowerCase():'J'+esc(p.j))+', '+fmtDate(p.fecha)+(p.hora?' '+esc(p.hora):'')+(p.sede?' · '+esc(p.sede):'')+(o?' <span class="x3-'+o+'">'+(o==='V'?'victoria':o==='D'?'derrota':'empate')+'</span>':'');}
function answer(raw){
  var q=norm(raw),t=findTeam(q),pl=findPlayer(q),teams=t?[t]:DATA.equipos;
  if(/chiste|broma|hazme reir|hazme gracia|algo gracioso|cuentame algo|me aburro/.test(q)||(lastWasJoke&&/^\s*(otro|otra|mas|uno mas|venga)\b/.test(q))){lastWasJoke=true;return joke()+'<br><small class="x3-hint">¿Otro? Escribe «otro» 😄</small>';}
  lastWasJoke=false;
  if(/^\s*(hola|buenas|kaixo|hey|ey)\b/.test(q)&&q.length<20)return '¡Hola! 🎾 Pregúntame por partidos, clasificaciones, resultados, jugadores o noticias del DMP.';
  if(/gracias|eskerrik/.test(q))return '¡A mandar! Si necesitas algo más, aquí estoy botando. 🎾';
  if(/que (puedes|sabes)|ayuda|como funciona|que haces/.test(q))return 'Te puedo decir:<br>• Cuándo y dónde juega cada categoría<br>• Cómo va la clasificación de liga y la copa<br>• Los últimos resultados, pareja a pareja<br>• Quién lleva mejor % de victorias<br>• Las últimas noticias<br>• Y chistes de pádel, si te hace falta reírte un rato 😄<br>Puedes preguntar, por ejemplo: <i>«¿cuándo juegan las chicas?»</i> o <i>«¿cómo va Jorge Negro?»</i>';
  if(pl&&!/clasif|proxim|cuando/.test(q)){var s=pstat(pl.p,/copa|kopa/.test(q)?'copa':/liga/.test(q)?'liga':'total');return '<b>'+esc(pl.p.nombre)+'</b> ('+esc(pl.t.nombre)+'): '+s.pj+(s.pj===1?' partido, ':' partidos, ')+s.pg+(s.pg===1?' ganado (':' ganados (')+s.pct+'%), sets '+s.sg+'-'+s.sp+' ('+(/copa|kopa/.test(q)?'copa':/liga/.test(q)?'liga':'liga + copa')+').'+go('ranking','','Ver ranking');}
  if(/donde|sede|pic|pista|instalacion|direccion|llegar/.test(q)&&!/proxim|cuando/.test(q)){
    return 'Los partidos en casa se juegan en <b>BamVolea PIC</b> (Padel Indoor Center). Fuera de casa depende del rival: en cada partido del calendario verás la sede. No tengo la dirección exacta guardada, así que mejor búscala en el mapa.'+go(t?t.id:'inicio',t?'partidos':'','Ver calendario');}
  if(/copa|kopa|eliminatori|cuadro|semifinal|cuartos|octavos|\bfinal\b/.test(q)&&!/jugador|mejor|ranking|top|quien/.test(q)){
    return teams.map(function(x){var ce=copaEstado(x);if(!ce)return '<b>'+esc(x.nombre)+'</b>: sin datos de copa.';var p=nextOf(x,copaPartidos(x)),l=lastOf(x,copaPartidos(x));
      return '🏆 <b>'+esc(x.nombre)+'</b>: '+esc(ce.txt)+'.'+(l?'<br>Último: '+mLine(x,l):'')+(p?'<br>Próximo: '+mLine(x,p):'');}).join('<br><br>')+(t&&t.copa?go(t.id,'copa','Ver copa'):'');}
  if(/clasif|posicion|puesto|tabla|como vamos|como va|lider|lideres|primeros|puntos/.test(q)){
    return teams.map(function(x){var st=teamStats(x);return '<b>'+esc(x.nombre)+'</b> ('+esc(x.categoria)+'): '+(st.pos?st.pos+'º de '+st.total+' con '+num(st.row.pts)+' puntos':'sin clasificación');}).join('<br>')+(t?go(t.id,'clasificacion','Ver clasificación'):'');}
  if(/resultado|ultimo|ultima|gano|ganamos|perdi|marcador|jornada pasada|como quedo|quedamos/.test(q)){
    var rows=teams.map(function(x){var p=lastOf(x);return p?mLine(x,p):'<b>'+esc(x.nombre)+'</b>: aún sin resultados.';});
    var extra='';if(t){var p=lastOf(t);if(p&&p.parejas&&p.parejas.length)extra='<div class="x3-prs">'+p.parejas.map(function(z){return (z.g?'✅ ':'❌ ')+esc(z.dmp)+' · '+esc(z.sets);}).join('<br>')+'</div>';}
    return rows.join('<br>')+extra+(t?go(t.id,'partidos','Ver partidos'):'');}
  if(/proxim|siguiente|cuando|calendario|juega|jugamos|partido|horario|hora/.test(q)){
    return teams.map(function(x){var p=nextOf(x);return p?mLine(x,p):'<b>'+esc(x.nombre)+'</b>: no hay partidos pendientes.';}).join('<br>')+(t?go(t.id,'partidos','Ver calendario'):'');}
  if(/jugador|mejor|ranking|top|quien|crack|estadistic|porcentaje/.test(q)){
    var md=/copa|kopa/.test(q)?'copa':/liga/.test(q)?'liga':'total';var all=(t?t.jugadores.map(function(p){var s=pstat(p,md);s.team=t;return s;}).sort(rankSort):allPlayers(DATA,md)).filter(function(p){return p.pj>0;}).slice(0,5);
    return all.length?'Top '+(t?esc(t.nombre):'del club')+' por % de victorias ('+(md==='total'?'liga + copa':md)+'):<br>'+all.map(function(p,i){return (i+1)+'. '+esc(p.nombre)+' — '+p.pct+'% ('+p.pg+'/'+p.pj+')';}).join('<br>')+go(t?t.id:'ranking',t?'jugadores':'',t?'Ver jugadores':'Ver ranking'):'Todavía no hay estadísticas de jugadores.';}
  if(/instagram|insta\b|redes/.test(q))return igUrl(DATA)?'Estamos en Instagram como <b>@'+esc(String(DATA.instagram).replace(/^@/,''))+'</b>: <a class="x3-go" href="'+igUrl(DATA)+'" target="_blank" rel="noopener">Abrir Instagram ↗</a>':'Todavía no tengo el Instagram del club.';

    return teams.map(function(x){var n=x.jugadores.filter(function(p){return pstat(p,'total').pj>0;}).length;return '<b>'+esc(x.nombre)+'</b>: '+n+' jugador'+(/femen/i.test(x.categoria)?'as':'es')+' han jugado esta temporada.';}).join('<br>')+go('plantilla','','Ver plantilla');}
  if(/noticia|cronica|foto|novedad/.test(q)){var ns=news(DATA);return ns.length?'Lo último: <b>'+esc(ns[0].titulo)+'</b> ('+longDate(ns[0].fecha)+').'+go('noticias','','Ver noticias'):'Aún no hay noticias publicadas.';}
  if(/equipo|categoria|cuantos/.test(q))return 'El DMP tiene '+DATA.equipos.length+' equipos en la Liga Bizkaina:<br>'+DATA.equipos.map(function(x){return '• <b>'+esc(x.nombre)+'</b> — '+esc(x.categoria);}).join('<br>');
  if(t){var st=teamStats(t),p=nextOf(t);return '<b>'+esc(t.nombre)+'</b> va '+(st.pos?st.pos+'º con '+num(st.row.pts)+' puntos':'sin clasificación')+'.'+(p?'<br>Próximo: '+mLine(t,p):'')+go(t.id,'','Ver '+esc(t.corto||t.nombre));}
  return 'Esa no me la sé 😅 y prefiero no inventármela. Prueba con partidos, clasificación, resultados, jugadores o noticias.';
}
var JOKES=["Hoy es el Día del Pádel. Felicidades a todos los pádels… y a las mádels también. 👨‍👧","—Papá, ¿qué me vas a dejar en herencia?<br>—La pala, hijo. Yo siempre he sido un buen pádel.","Pádel nuestro que estás en la pista, santificado sea tu saque, venga a nosotros tu globo…","Pádel no hay más que uno. Y a ti te encontré en la pista 3.","«Luke… yo soy tu pádel.» «¡Noooo! ¡Si tú eres de tenis!»","De tal pala, tal astilla. Mi pádel también fallaba todas las voleas.","Mi mujer dice que quiero más al pádel que a ella. Y eso que todavía no sabe lo de la pala nueva.","En mi casa manda el pádel de familia: decide él cuándo se juega… después de preguntarle a la mádel.","—Mi pareja y yo lo hacemos tres veces por semana.<br>—¡Qué envidia!<br>—Y los domingos, partido de liga.","A mí me gusta que me la pongan arriba y despacito… La bola, digo. Para rematar.","Busco pareja estable. La última me dejó por uno que tenía mejor revés.","—¿Tú de qué lado juegas?<br>—Del que me dejen, que llevo una racha muy mala.","Ayer duré tres horas con mi pareja. Tres sets, tie-break incluido. Hoy no me puedo ni mover.","Mi pareja me ha dicho que o cambio la forma de cogerla o me deja. La pala, claro: empuñadura continental.","—Cariño, ¿me engañas con otra?<br>—Solo los martes, pero es que tiene una derecha…","Con los años ya no aguanto lo de antes: ahora al segundo set pido cambio de pareja… y una silla.","Lo mío con mi pareja es amor verdadero: nos gritamos «¡tuya!» los dos a la vez y la bola se queda en medio.","Me han dicho que tengo buena mano. Lástima que la bola vaya siempre a la otra.","—¿Qué le regalas a tu pádel por su día?<br>—Un bote de bolas. Que luego dice que nunca le doy nada.","El pádel es como el matrimonio: empiezas por amor, sigues por costumbre y siempre hay un cristal de por medio.","¿Por qué la pelota de pádel nunca se aburre? Porque se pasa la vida de rebote en rebote. 🎾", "—¿Tú juegas de drive o de revés?<br>—Yo juego de milagro.", "¿Qué le dice una pala a otra antes del partido? «Nos vemos en la red».", "Soy tan malo con el globo que el último que tiré todavía está en órbita. 🚀", "¿Por qué el cristal es el mejor amigo del jugador de pádel? Porque siempre te devuelve lo que le das.", "—¿Qué tal el partido?<br>—Bien: la bola ha tocado más veces la reja que mi pala.", "¿Cuál es el colmo de un jugador de pádel? Pasarse la vida entre cristales y no romper ninguno.", "—¿Por qué llegas tan tarde?<br>—El partido fue a tres sets… y el almuerzo de después, a cinco.", "¿Qué hace una pelota de pádel en el gimnasio? Botes. Muchos botes.", "Le pregunté a mi pareja de pádel si confiaba en mí. Me dijo: «Sí, pero quédate en tu lado».", "¿Qué le dice la red a la pelota? «Hoy por aquí no pasas».", "El médico me mandó hacer cardio. Ahora corro detrás de todas las bolas que me pasan por el medio.", "¿Por qué fue la pala al psicólogo? Porque se sentía llena de agujeros.", "¿Cuántos jugadores de pádel hacen falta para cambiar una bombilla? Cuatro: uno la cambia y los otros tres le gritan «¡tuya!».", "Dicen que el pádel engancha. Yo voy por la tercera pala y sigo sin dar una.", "Yo no fallo la bandeja: es que se la sirvo directamente a la reja.", "¿Por qué las pelotas de pádel vienen en bote? Para que no se escapen antes del partido.", "Como pelota oficial del DMP os pido una cosa: no me deis tan fuerte, que yo solo vine a botar. 😅", "—Entrenador, ¿cómo puedo mejorar mi remate?<br>—Empieza por mirar la bola, no a la grada.", "¿Qué es lo más rápido del pádel? La excusa después de fallar una volea fácil."];

function joke(){if(!jokeBag.length){jokeBag=JOKES.map(function(_,i){return i;});for(var i=jokeBag.length-1;i>0;i--){var k=Math.floor(Math.random()*(i+1)),t=jokeBag[i];jokeBag[i]=jokeBag[k];jokeBag[k]=t;}}return JOKES[jokeBag.pop()];}
function ask(text){
  if(!String(text).trim())return;
  xAdd(esc(text),'me');
  var typing=xAdd('<span class="x3-typing"><i></i><i></i><i></i></span>','bot');
  x3.classList.add('talk');
  setTimeout(function(){typing.innerHTML=answer(text);xMsgs.scrollTop=xMsgs.scrollHeight;x3.classList.remove('talk');},450);
}
function x3Open(){x3.classList.add('open');if(!xOpened){xOpened=true;xAdd('¡Hola! Soy <b>X3</b> 🎾, la pelota oficial del DMP. Pregúntame lo que quieras sobre los partidos, la clasificación o los jugadores.');xSetChips();}setTimeout(function(){try{xInput.focus({preventScroll:true});}catch(e){}},200);}
x3.querySelector('.x3-fab').addEventListener('click',function(){if(x3.classList.contains('open'))x3.classList.remove('open');else x3Open();});
x3.querySelector('.x3-close').addEventListener('click',function(){x3.classList.remove('open');});
x3.querySelector('.x3-form').addEventListener('submit',function(e){e.preventDefault();var v=xInput.value;xInput.value='';ask(v);});
x3.addEventListener('click',function(e){
  var c=e.target.closest('[data-q]');if(c){ask(c.dataset.q);return;}
  var g=e.target.closest('[data-go]');if(g){var a=g.dataset.go.split(':');if(a[1])sub=a[1];if(location.hash==='#'+a[0]){render();}else{pendingSub=a[1]||null;location.hash=a[0];}if(window.innerWidth<700)x3.classList.remove('open');}
});
setTimeout(function(){x3.classList.add('hint');setTimeout(function(){x3.classList.remove('hint');},5000);},1500);
render();
})();
